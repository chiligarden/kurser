<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kravhanteringsmodellen Stjärnan</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --text-main: #2b2d42;
      --text-muted: #6c757d;
      --accent-center: #3a5a40;
      --accent-node: #4a4e69;
      --accent-node-active: #22223b;
      --ring-global: rgba(88, 129, 87, 0.35);
      --ring-local: rgba(74, 78, 105, 0.4);
      --card-bg: #ffffff;
      --shadow-color: rgba(0, 0, 0, 0.08);
      --pulse-glow: rgba(141, 153, 174, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 900px;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: var(--text-main);
    }

    header p {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      max-width: 620px;
      aspect-ratio: 1 / 1;
      margin: 10px 0;
    }

    svg.main-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* GLOBAL ITERATION: Stor roterande tunn streckad cirkel */
    .global-group {
      transform-origin: 300px 300px;
      animation: rotateGlobal 90s linear infinite;
      pointer-events: none;
    }

    .global-ring {
      fill: none;
      stroke: var(--ring-global);
      stroke-width: 2.5;
      stroke-dasharray: 6 5;
    }

    .global-arrow {
      fill: var(--ring-global);
    }

    @keyframes rotateGlobal {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* NODER & INTERAKTIONER */
    .node-wrapper {
      cursor: pointer;
    }

    .hitbox {
      fill: transparent;
      stroke: none;
    }

    .visual-group {
      transition: transform 0.25s ease-out;
      transform-origin: 0px 0px;
    }

    .node-circle {
      fill: #ffffff;
      stroke: var(--accent-node);
      stroke-width: 2.5;
      transition: fill 0.3s, stroke 0.3s;
    }

    /* Ren och stilren fyllning vid klick */
    .node-wrapper.active .node-circle {
      fill: var(--accent-node-active);
      stroke: var(--accent-node-active);
    }

    .node-text {
      font-size: 13px;
      font-weight: 600;
      fill: var(--text-main);
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
      transition: fill 0.3s;
    }

    .node-wrapper.active .node-text {
      fill: #ffffff;
    }

    /* CENTRAL NOD */
    .center-circle {
      fill: var(--accent-center);
      stroke: #ffffff;
      stroke-width: 4;
    }

    .center-text {
      font-size: 15px;
      font-weight: 700;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: central;
      letter-spacing: 0.5px;
    }

    /* LOKAL ITERATION: Tunn streckad roterande cirkel med pilspets */
    .spinning-loop {
      transform-origin: 0px 0px;
      animation: rotateLocal 14s linear infinite;
      pointer-events: none;
    }

    .local-loop {
      fill: none;
      stroke: var(--ring-local);
      stroke-width: 2;
      stroke-dasharray: 5 4;
      transition: stroke 0.3s;
    }

    .local-loop-arrow {
      fill: var(--ring-local);
      transition: fill 0.3s;
    }

    .node-wrapper.active .local-loop {
      stroke: var(--accent-node-active);
    }

    .node-wrapper.active .local-loop-arrow {
      fill: var(--accent-node-active);
    }

    @keyframes rotateLocal {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* ANSLUTNINGSLINJER */
    .connector-line {
      stroke: #e0e1dd;
      stroke-width: 1.5;
      stroke-dasharray: 4 4;
    }

    /* MJUK FOKUSFLYTT */
    .pulse-ring {
      fill: none;
      stroke: var(--pulse-glow);
      stroke-width: 0;
      opacity: 0;
      pointer-events: none;
    }

    .node-wrapper.pulsing .pulse-ring {
      animation: softPulse 3.5s ease-out;
    }

    @keyframes softPulse {
      0% {
        r: 50px;
        stroke-width: 6px;
        opacity: 0.8;
      }
      50% {
        opacity: 0.3;
      }
      100% {
        r: 70px;
        stroke-width: 1px;
        opacity: 0;
      }
    }

    /* INFORMATIONSKORT */
    .info-card {
      min-height: 120px;
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 30px var(--shadow-color);
      border: 1px solid rgba(0,0,0,0.05);
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .info-card h2 {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--accent-node-active);
      margin-bottom: 6px;
    }

    .info-card p {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .info-card .examples {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-top: 10px;
    }

    .example-tag {
      background: #f0f2f5;
      color: var(--text-main);
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 500;
    }

    @media (max-width: 480px) {
      header h1 { font-size: 1.4rem; }
      .node-text { font-size: 11px; }
      .center-text { font-size: 13px; }
      .info-card { padding: 15px; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Kravhanteringsmodellen Stjärnan</h1>
    <p>Klicka på en aktivitet för att visa information</p>
  </header>

  <div class="canvas-container">
    <svg class="main-svg" viewBox="0 0 600 600" id="svgCanvas">
      <g class="global-group">
        <circle cx="300" cy="300" r="235" class="global-ring" />
        <path d="M 535 300 L 528 291 L 542 291 Z" class="global-arrow" />
        <path d="M 65 300 L 72 309 L 58 309 Z" class="global-arrow" />
      </g>

      <g id="connectors"></g>

      <g transform="translate(300, 300)">
        <circle cx="0" cy="0" r="58" class="center-circle" />
        <text x="0" y="0" class="center-text">Kravhantering</text>
      </g>

      <g id="nodesContainer"></g>
    </svg>
  </div>

  <div class="info-card" id="infoCard">
    <h2 id="cardTitle">Klicka på en aktivitet</h2>
    <p id="cardDesc">Utforska de fem aktiviteterna i modellen. Den stora pilen visar global iteration mellan aktiviteter, medan de små streckade pilarna visar lokal iteration inom varje steg.</p>
    <div class="examples" id="cardExamples"></div>
  </div>
</div>

<script>
  const activities = [
    {
      id: "samla-in",
      title: ["Samla in"],
      angle: -90,
      desc: "Identifiera behov, förväntningar och begränsningar från intressenter och domänkontext.",
      examples: ["Intervjuer", "Workshops", "Enkäter", "Observationer", "Skuggning"]
    },
    {
      id: "strukturera",
      title: ["Strukturera"],
      angle: -18,
      desc: "Organisera, kategorisera och analysera insamlade krav för att hitta samband och konflikter.",
      examples: ["Kravhierarkier", "Användarresor", "Slicing", "Kategorisering"]
    },
    {
      id: "prioritera",
      title: ["Prioritera"],
      angle: 54,
      desc: "Värdera och ordna kraven baserat på affärsnytta, risk, kostnad och beroenden.",
      examples: ["MoSCoW", "WSJF", "Kano-modellen", "Värde vs. Ansträngning"]
    },
    {
      id: "dokumentera",
      title: ["Dokumentera"],
      angle: 126,
      desc: "Formulera och fäst kraven i lämpliga format för kommunikation och framtida förvaltning.",
      examples: ["User Stories", "Användningsfall", "BPMN", "Beslutstabeller"]
    },
    {
      id: "kvalitetssakra",
      title: ["Kvalitets-", "säkra"], // Uppdelat på två rader för perfekt passform
      angle: 198,
      desc: "Validera och verifiera att kraven är korrekta, kompletta, mätbara och förståeliga.",
      examples: ["Granskningar", "Acceptanstester", "INVEST-kriterier", "Prototyper"]
    }
  ];

  const svgCenter = 300;
  const radius = 180;
  const nodesContainer = document.getElementById('nodesContainer');
  const connectorsContainer = document.getElementById('connectors');
  const cardTitle = document.getElementById('cardTitle');
  const cardDesc = document.getElementById('cardDesc');
  const cardExamples = document.getElementById('cardExamples');

  function init() {
    activities.forEach((act) => {
      const rad = (act.angle * Math.PI) / 180;
      const x = svgCenter + radius * Math.cos(rad);
      const y = svgCenter + radius * Math.sin(rad);

      // Anslutningslinje
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", svgCenter);
      line.setAttribute("y1", svgCenter);
      line.setAttribute("x2", x);
      line.setAttribute("y2", y);
      line.setAttribute("class", "connector-line");
      connectorsContainer.appendChild(line);

      // Wrapper-grupp vid nodens centrum
      const gWrapper = document.createElementNS("http://www.w3.org/2000/svg", "g");
      gWrapper.setAttribute("class", "node-wrapper");
      gWrapper.setAttribute("id", `node-${act.id}`);
      gWrapper.setAttribute("transform", `translate(${x}, ${y})`);

      // 1. Stabil Hitbox (radie = 60px)
      const hitbox = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      hitbox.setAttribute("cx", "0");
      hitbox.setAttribute("cy", "0");
      hitbox.setAttribute("r", "60");
      hitbox.setAttribute("class", "hitbox");

      // 2. Puls-ring för fokusflytt
      const pulseCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      pulseCircle.setAttribute("cx", "0");
      pulseCircle.setAttribute("cy", "0");
      pulseCircle.setAttribute("r", "48");
      pulseCircle.setAttribute("class", "pulse-ring");

      // 3. Intern visuell grupp
      const gVisual = document.createElementNS("http://www.w3.org/2000/svg", "g");
      gVisual.setAttribute("class", "visual-group");

      // Lokal iteration (Tunn streckad roterande cirkel med pilspets)
      const loopGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
      loopGroup.setAttribute("class", "spinning-loop");
      
      const loopCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      loopCircle.setAttribute("cx", "0");
      loopCircle.setAttribute("cy", "0");
      loopCircle.setAttribute("r", "54");
      loopCircle.setAttribute("class", "local-loop");

      const loopArrow = document.createElementNS("http://www.w3.org/2000/svg", "path");
      // Liten pilspets vid toppen av den lokala cirkeln
      loopArrow.setAttribute("d", "M 0,-59 L 6,-50 L -6,-50 Z");
      loopArrow.setAttribute("class", "local-loop-arrow");

      loopGroup.appendChild(loopCircle);
      loopGroup.appendChild(loopArrow);

      // Huvudcirkel för noden (Ökad radie till 47px för bättre utrymme)
      const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      circle.setAttribute("cx", "0");
      circle.setAttribute("cy", "0");
      circle.setAttribute("r", "47");
      circle.setAttribute("class", "node-circle");

      // Texthantering med stöd för flerraderstext via <tspan>
      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("x", "0");
      text.setAttribute("class", "node-text");

      if (act.title.length === 1) {
        text.setAttribute("y", "0");
        text.textContent = act.title[0];
      } else {
        // Om ordet är uppdelat på två rader
        text.setAttribute("y", "-7");
        act.title.forEach((lineText, index) => {
          const tspan = document.createElementNS("http://www.w3.org/2000/svg", "tspan");
          tspan.setAttribute("x", "0");
          if (index > 0) tspan.setAttribute("dy", "15");
          tspan.textContent = lineText;
          text.appendChild(tspan);
        });
      }

      gVisual.appendChild(loopGroup);
      gVisual.appendChild(circle);
      gVisual.appendChild(text);

      gWrapper.appendChild(hitbox);
      gWrapper.appendChild(pulseCircle);
      gWrapper.appendChild(gVisual);

      gWrapper.addEventListener('click', (e) => {
        e.stopPropagation();
        handleSelect(act);
      });

      nodesContainer.appendChild(gWrapper);
    });

    document.addEventListener('click', resetCard);
    startRandomFocusPulse();
  }

  function handleSelect(act) {
    activities.forEach(a => {
      const el = document.getElementById(`node-${a.id}`);
      if (a.id === act.id) {
        el.classList.add('active');
      } else {
        el.classList.remove('active');
      }
    });

    cardTitle.textContent = act.title.join("");
    cardDesc.textContent = act.desc;
    
    cardExamples.innerHTML = '';
    act.examples.forEach(ex => {
      const tag = document.createElement('span');
      tag.className = 'example-tag';
      tag.textContent = ex;
      cardExamples.appendChild(tag);
    });
  }

  function resetCard() {
    activities.forEach(a => {
      document.getElementById(`node-${a.id}`).classList.remove('active');
    });

    cardTitle.textContent = "Klicka på en aktivitet";
    cardDesc.textContent = "Utforska de fem aktiviteterna i modellen. Den stora pilen visar global iteration mellan aktiviteter, medan de små streckade pilarna visar lokal iteration inom varje steg.";
    cardExamples.innerHTML = '';
  }

  function startRandomFocusPulse() {
    let lastIndex = -1;

    function triggerPulse() {
      let randomIndex;
      do {
        randomIndex = Math.floor(Math.random() * activities.length);
      } while (randomIndex === lastIndex);

      lastIndex = randomIndex;
      const targetAct = activities[randomIndex];
      const nodeEl = document.getElementById(`node-${targetAct.id}`);

      nodeEl.classList.remove('pulsing');
      void nodeEl.offsetWidth;
      nodeEl.classList.add('pulsing');

      const nextInterval = Math.floor(Math.random() * 2500) + 4500;
      setTimeout(triggerPulse, nextInterval);
    }

    setTimeout(triggerPulse, 2000);
  }

  window.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
